[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-trading-bot"
version = "1.0.0"
description = "A multi-strategy Forex trading bot with backtesting, risk management, and Telegram alerts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pandas-ta>=0.3.14b1",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "schedule>=1.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
backtest = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
]
telegram = [
    "python-telegram-bot>=21.0",
]
oanda = [
    "oandapyV20>=0.7",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
all = [
    "forex-trading-bot[backtest,telegram,oanda,dev]",
]

[project.scripts]
forex-bot = "src.main:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
